<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://feesh.run.place">
    <link rel="dns-prefetch" href="https://feesh.run.place">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geelee's Vappy Aquarium</title>

    <!-- Discord & Open Graph Embed Meta Tags -->
    <meta property="og:title" content="Geelee's Vappy Aquarium" />
    <meta property="og:description" content="Welcome to the aquarium! Check out my gallery and collection." />
    <meta property="og:url" content="https://feesh.run.place/" />
    <meta property="og:image" content="https://feesh.run.place/feesh_gallery/feesh1.jpg" />
    <meta name="theme-color" content="#4a90e2" /> <!-- Custom sidebar accent color (Hex code) -->
    
    <!-- Optional: Large Image Banner Style -->
    <meta name="twitter:card" content="summary_large_image" />

    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 2rem;
            text-align: center;
        }

        /* Responsive Grid Layout */
        .gallery {
            display: grid;
            /* Creates columns that automatically fit the screen size */
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            max-width: 1000px;
            margin: 2rem auto 0 auto;
        }

        /* Individual Image Cards */
        .gallery img {
            width: 100%;
            height: auto; /* Scales height naturally with width */
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        /* Subtle Zoom Effect on Hover */
        .gallery img:hover {
            transform: scale(1.04);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Vappy Gallery</h1>
    <p>Check out some of my favorite images!</p>

    <!-- The Gallery Grid -->
    <div class="gallery">
        <img src="feesh_gallery/feesh1.jpg" alt="Me when I try to socialize">
        <img src="feesh_gallery/feesh2.png" alt="Dont let the fish drive">
        <img src="feesh_gallery/feesh3.png" alt="He tried his best">
        <img src="feesh_gallery/feesh4.png" alt="Playing with toy">
        <img src="feesh_gallery/feesh5.jpg" alt="Alien">
        <img src="feesh_gallery/feesh6.jpg" alt="Dumpling">
        <img src="feesh_gallery/feesh7.png" alt="Cardboard Fish">
    </div>

</body>
</html>
